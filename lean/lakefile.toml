# The paper's proofs in Lean, built with `make lean` from the public tree.
name = "saddle"
defaultTargets = ["Saddle"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Saddle"
