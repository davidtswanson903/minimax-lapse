name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: make check
      - run: make reproduce
  lean:
    # hashFiles is not available in a job's condition, only in a step's, so each step after the checkout carries it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('lean/lakefile.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: hashFiles('lean/lakefile.toml') != ''
        run: python -m pip install -e ".[dev]"
      - if: hashFiles('lean/lakefile.toml') != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - if: hashFiles('lean/lakefile.toml') != ''
        run: make lean
      - if: hashFiles('lean/lakefile.toml') != ''
        run: git diff --exit-code results/lean.json docs/blueprint.md
