  status: checked
  uses: [equilibrium.coldest]
coldest.chain:
  statement: "On the open transverse-field chain of {{coldestChainCells}} cells, whose optimal weightings form a segment, the proportions of the coldest equilibrium's multipliers keep their two ends equal, each end rising from {{coldestChainFirstEnd}} to {{coldestChainLastEnd}} as the bound's height above the common value falls from {{coldestFirstGap}} to {{coldestLastGap}}."
