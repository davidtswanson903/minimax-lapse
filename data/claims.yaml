coldest.symmetric:
  statement: "Where a unitary maps the densities onto one another by a permutation of the places, and the densities with the identity are linearly independent, the coldest equilibrium's multipliers are unchanged by the permutation, so their proportions tend to the one optimal weighting it leaves unchanged, where there is only one."
