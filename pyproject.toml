[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-lapse"
version = "1.0.4"
description = "A saddle for the local energy densities of a closed quantum system."
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0", "numpy>=1.26", "cvxpy>=1.5", "matplotlib>=3.8", "mpmath>=1.3", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.repokit]
package = "saddle"
lean = "lean"

[tool.repokit.numbers_from]
# which grade's stored results each experiment's printed numbers come from
ring = "paper"
catalogue = "survey"
scaling = "survey"
simulation = "paper"
bridges = "paper"
exits = "paper"
signals = "paper"
timeless = "paper"
critical = "paper"
patch = "paper"
records = "paper"
depths = "paper"
space = "paper"
bump = "paper"
unique = "survey"
largedrop = "paper"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
